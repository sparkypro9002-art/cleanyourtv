name: Compile Windows 10 Edition CleanYourTV (v3.2 + PR 311)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Gathin23/cleanyourtv (v3.2)
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Merge PR #311 Bluetooth Pill with Self-Healing Verification
        run: |
          git config user.name "Builder"
          git config user.email "builder@users.noreply.github.com"
          git fetch origin pull/311/head:pr-311

          BASE_COMMIT=$(git merge-base main pr-311)
          git format-patch $BASE_COMMIT..pr-311 --stdout > pr311.patch
          git apply --3way --ignore-space-change --ignore-whitespace pr311.patch || true

          git checkout main -- launcher/app/src/main/java/com/gathin/tvhome/HomeKeyService.java

          python3 - << 'PYEOF'
          import glob, os, re, subprocess

          for path in glob.glob("launcher/**/*", recursive=True):
              if not os.path.isfile(path) or path.endswith(".java"):
                  continue
              try:
                  txt = open(path, "r", encoding="utf-8").read()
              except Exception:
                  continue
              if "<<<<<<<" not in txt:
                  continue
              def resolve_xml(m):
                  ours, theirs = m.group(1), m.group(2)
                  if "bluetooth" in theirs.lower() or "bt" in theirs.lower():
                      return ours + theirs
                  return ours
              txt = re.sub(r"<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n", resolve_xml, txt, flags=re.DOTALL)
              open(path, "w", encoding="utf-8").write(txt)

          java_conflicts = {}
          for path in glob.glob("launcher/**/*.java", recursive=True):
              txt = open(path, "r", encoding="utf-8").read()
              if "<<<<<<<" in txt:
                  java_conflicts[path] = txt

          def strip_sc(s):
              s = re.sub(r'//.*?$', '', s, flags=re.MULTILINE)
              s = re.sub(r'/\*.*?\*/', '', s, flags=re.DOTALL)
              s = re.sub(r'"(?:\\.|[^"\\])*"', '""', s)
              return s

          def b_delta(s):
              c = strip_sc(s)
              return c.count("{") - c.count("}")

          def render_java(raw_text, fallback_indices):
              idx = 0
              def repl(m):
                  nonlocal idx
                  cur = idx
                  idx += 1
                  ours, theirs = m.group(1), m.group(2)
                  if cur in fallback_indices:
                      return ours
                  if "bluetooth" not in theirs.lower() and "bt" not in theirs.lower():
                      return ours
                  if b_delta(theirs) != 0:
                      return ours
                  method_split = re.search(r'(\n[ \t]*\}\s*\n+[ \t]*(?:private|public|protected)\s+)', ours)
                  has_method_in_theirs = re.search(r'^\s*(?:private|public|protected)\s+', theirs, flags=re.MULTILINE)
                  if method_split and not has_method_in_theirs:
                      pos = method_split.start(1)
                      return ours[:pos] + "\n" + theirs.rstrip("\n") + ours[pos:]
                  if b_delta(ours) == 0:
                      return ours + theirs
                  return ours
              return re.sub(r"<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n", repl, raw_text, flags=re.DOTALL)

          fallback_map = {p: set() for p in java_conflicts}
          for p, raw in java_conflicts.items():
              open(p, "w", encoding="utf-8").write(render_java(raw, fallback_map[p]))

          os.chmod("launcher/gradlew", 0o755)
          for attempt in range(1, 6):
              proc = subprocess.run(["./gradlew", "compileDebugJavaWithJavac"], cwd="launcher", stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if proc.returncode == 0:
                  break
              for p, raw in java_conflicts.items():
                  num_blocks = len(re.findall(r"<<<<<<<", raw))
                  for b in range(num_blocks):
                      if b not in fallback_map[p]:
                          fallback_map[p].add(b)
                          break
                  open(p, "w", encoding="utf-8").write(render_java(raw, fallback_map[p]))
          else:
              for p in java_conflicts:
                  subprocess.run(["git", "checkout", "main", "--", p])
          PYEOF

      - name: Apply Windows 10 Bottom Taskbar, System Tray & 6x2 Desktop Grid
        working-directory: ./launcher
        run: |
          python3 - << 'EOF'
          import glob, os, re

          # 1. Bake your 24-question Windows 10 defaults into Java config readers
          for java_file in glob.glob("app/src/main/java/**/*.java", recursive=True):
              jtxt = open(java_file).read()
              true_keys = [
                  "show_bluetooth", "bluetooth_pill", "show_bluetooth_pill",
                  "date_below_clock", "header_white", "wifi_status_color",
                  "wifi_status_warnings", "dock_glass", "always_show_names",
                  "icon_only_buttons", "icon_only_inputs", "reduced_motion", "wallpaper"
              ]
              false_keys = [
                  "dock_title", "fill_dock", "dock_even_padding", "top_menu",
                  "ambient_glow", "app_glow", "cinematic_home", "advanced_effects",
                  "module_cards", "focus_overshoot"
              ]
              for k in true_keys:
                  jtxt = re.sub(rf'(optBoolean\(\s*"{k}"\s*,\s*)false(\s*\))', r'\g<1>true\g<2>', jtxt)
              for k in false_keys:
                  jtxt = re.sub(rf'(optBoolean\(\s*"{k}"\s*,\s*)true(\s*\))', r'\g<1>false\g<2>', jtxt)

              # Default columns to 6 and rows_below_dock to 2
              jtxt = re.sub(r'(optInt\(\s*"columns"\s*,\s*)\d+(\s*\))', r'\g<1>6\g<2>', jtxt)
              jtxt = re.sub(r'(optInt\(\s*"rows_below_dock"\s*,\s*)\d+(\s*\))', r'\g<1>2\g<2>', jtxt)
              jtxt = re.sub(r'(optInt\(\s*"dock_opacity"\s*,\s*)\d+(\s*\))', r'\g<1>85\g<2>', jtxt)
              open(java_file, "w").write(jtxt)

          # 2. Patch activity_main.xml: Move System Tray & Taskbar to bottom edge (1A, 9A, 11A)
          for layout_file in glob.glob("app/src/main/res/layout*/activity_main.xml"):
              xml = open(layout_file).read()
              # Anchor top header/system tray to bottom edge for Windows 10 System Tray
              xml = re.sub(r'android:layout_gravity="top"', 'android:layout_gravity="bottom"', xml)
              xml = re.sub(r'android:layout_gravity="top\|end"', 'android:layout_gravity="bottom|end"', xml)
              xml = re.sub(r'android:layout_gravity="top\|right"', 'android:layout_gravity="bottom|right"', xml)
              xml = re.sub(r'android:layout_alignParentTop="true"', 'android:layout_alignParentBottom="true"', xml)
              open(layout_file, "w").write(xml)
              print(f"Patched Windows 10 bottom taskbar & system tray in {layout_file}")

          # 3. Enable R8 shrinking for ~550 KB APK size
          gradle_file = "app/build.gradle"
          if os.path.exists(gradle_file):
              g = open(gradle_file).read()
              g = re.sub(r'minifyEnabled\s+false', 'minifyEnabled true\n            shrinkResources true', g)
              open(gradle_file, "w").write(g)
          EOF

          ./gradlew assembleRelease || ./gradlew assembleDebug

          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -n 1)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          $BUILD_TOOLS/zipalign -f -p 4 "$RAW_APK" aligned.apk
          keytool -genkey -v -keystore release.keystore -storepass android -alias releasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CleanYourTV,O=Android,C=IN"
          mkdir -p ../out_apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out ../out_apk/cleanyourtv-bt.apk aligned.apk
          ls -lh ../out_apk/cleanyourtv-bt.apk

      - name: Upload Windows 10 Edition APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Win10-APK
          path: out_apk/cleanyourtv-bt.apk
          
