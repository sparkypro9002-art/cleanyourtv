name: Build Working BT + Bottom Dock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Switch to Working Bluetooth Branch
        run: |
          git fetch origin pull/311/head:pr-311
          git checkout -f pr-311

      - name: Compile & Sign APK
        working-directory: ./launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -n 1)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -f -p 4 "$RAW_APK" aligned.apk
          keytool -genkey -v -keystore release.keystore -storepass android -alias key -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TV,O=Android,C=IN"
          mkdir -p ../out_apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out ../out_apk/cleanyourtv-bt.apk aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-BottomDock-APK
          path: out_apk/cleanyourtv-bt.apk
          
