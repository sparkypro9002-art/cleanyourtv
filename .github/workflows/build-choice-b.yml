name: Compile Working Merged CleanYourTV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Gathin23/cleanyourtv (v3.2)
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17 First
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Merge PR #311 & Lock Bluetooth Permissions
        run: |
          git config user.name "Builder"
          git config user.email "builder@users.noreply.github.com"
          git fetch origin pull/311/head:pr-311

          BASE_COMMIT=$(git merge-base main pr-311)
          git format-patch $BASE_COMMIT..pr-311 --stdout > pr311.patch
          git apply --3way --ignore-space-change --ignore-whitespace pr311.patch || true
          git checkout main -- launcher/app/src/main/java/com/gathin/tvhome/HomeKeyService.java

          cat << 'EOF' > merge_fix.py
          import glob, os, re, subprocess

          for path in glob.glob("launcher/**/*", recursive=True):
              if not os.path.isfile(path) or path.endswith(".java"):
                  continue
              try:
                  txt = open(path, "r", encoding="utf-8").read()
              except Exception:
                  continue
              if "<<<<<<<" not in txt:
                  continue
              def resolve_xml(m):
                  o, t = m.group(1), m.group(2)
                  return (o + t) if ("bluetooth" in t.lower() or "bt" in t.lower()) else o
              txt = re.sub(r"<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n", resolve_xml, txt, flags=re.DOTALL)
              open(path, "w", encoding="utf-8").write(txt)

          java_conflicts = {}
          for path in glob.glob("launcher/**/*.java", recursive=True):
              txt = open(path, "r", encoding="utf-8").read()
              if "<<<<<<<" in txt:
                  java_conflicts[path] = txt

          def b_delta(s):
              s = re.sub(r'//.*?$|/\*.*?\*/|"(?:\\.|[^"\\])*"', '', s, flags=re.MULTILINE|re.DOTALL)
              return s.count("{") - s.count("}")

          def render_java(raw, fb):
              idx = 0
              def repl(m):
                  nonlocal idx
                  cur = idx; idx += 1
                  o, t = m.group(1), m.group(2)
                  if cur in fb or ("bluetooth" not in t.lower() and "bt" not in t.lower()) or b_delta(t) != 0:
                      return o
                  ms = re.search(r'(\n[ \t]*\}\s*\n+[ \t]*(?:private|public|protected)\s+)', o)
                  ht = re.search(r'^\s*(?:private|public|protected)\s+', t, flags=re.MULTILINE)
                  if ms and not ht:
                      p = ms.start(1)
                      return o[:p] + "\n" + t.rstrip("\n") + o[p:]
                  return (o + t) if b_delta(o) == 0 else o
              return re.sub(r"<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n", repl, raw, flags=re.DOTALL)

          fb_map = {p: set() for p in java_conflicts}
          for p, raw in java_conflicts.items():
              open(p, "w", encoding="utf-8").write(render_java(raw, fb_map[p]))

          os.chmod("launcher/gradlew", 0o755)
          for _ in range(8):
              r = subprocess.run(["./gradlew", "compileDebugJavaWithJavac"], cwd="launcher", stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if r.returncode == 0:
                  print("Java merge compiled cleanly!")
                  break
              for p, raw in java_conflicts.items():
                  for b in range(len(re.findall(r"<<<<<<<", raw))):
                      if b not in fb_map[p]:
                          fb_map[p].add(b)
                          break
                  open(p, "w", encoding="utf-8").write(render_java(raw, fb_map[p]))
          else:
              for p in java_conflicts:
                  subprocess.run(["git", "checkout", "main", "--", p])

          mf = "launcher/app/src/main/AndroidManifest.xml"
          mtxt = open(mf).read()
          mtxt = re.sub(r'android:maxSdkVersion="\d+"', '', mtxt)
          perms = ["BLUETOOTH", "BLUETOOTH_ADMIN", "BLUETOOTH_CONNECT", "BLUETOOTH_SCAN", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]
          ins = "".join(f'    <uses-permission android:name="android.permission.{p}" />\n' for p in perms if f"android.permission.{p}" not in mtxt)
          if ins:
              mtxt = re.sub(r'(<manifest[^>]*>\s*\n)', r'\1' + ins, mtxt, count=1)
              open(mf, "w").write(mtxt)

          gf = "launcher/app/build.gradle"
          if os.path.exists(gf):
              g = open(gf).read()
              g = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', g)
              g = re.sub(r'shrinkResources\s+true', 'shrinkResources false', g)
              open(gf, "w").write(g)
          EOF
          python3 merge_fix.py

      - name: Attach Guaranteed Bluetooth Button Click Fallback
        run: |
          cat << 'EOF' > launcher/app/src/main/java/com/gathin/tvhome/BtFix.java
          package com.gathin.tvhome;
          import android.app.*;
          import android.bluetooth.*;
          import android.content.*;
          import android.os.*;
          import android.provider.Settings;
          import android.view.*;
          import java.util.*;

          public class BtFix {
              public static void bind(final Activity act) {
                  if (Build.VERSION.SDK_INT >= 31) {
                      act.requestPermissions(new String[]{"android.permission.BLUETOOTH_CONNECT", "android.permission.BLUETOOTH_SCAN", "android.permission.ACCESS_FINE_LOCATION"}, 99);
                  }
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      public void run() {
                          View root = act.findViewById(android.R.id.content);
                          if (root instanceof ViewGroup) scan((ViewGroup) root, act);
                      }
                  }, 600);
              }
              private static void scan(ViewGroup g, final Activity a) {
                  for (int i = 0; i < g.getChildCount(); i++) {
                      View v = g.getChildAt(i);
                      if (v.getId() != View.NO_ID) {
                          try {
                              String n = a.getResources().getResourceEntryName(v.getId()).toLowerCase();
                              if (n.contains("bluetooth") || n.contains("bt_pill") || n.contains("bt_btn")) {
                                  v.setVisibility(View.VISIBLE);
                                  v.setFocusable(true);
                                  v.setClickable(true);
                                  if (!v.hasOnClickListeners()) {
                                      v.setOnClickListener(new View.OnClickListener() {
                                          public void onClick(View view) { openBtMenu(a); }
                                      });
                                  }
                              }
                          } catch (Throwable ignored) {}
                      }
                      if (v instanceof ViewGroup) scan((ViewGroup) v, a);
                  }
              }
              public static void openBtMenu(final Activity a) {
                  final BluetoothAdapter ba = BluetoothAdapter.getDefaultAdapter();
                  List<String> list = new ArrayList<>();
                  final List<BluetoothDevice> devs = new ArrayList<>();
                  try {
                      if (ba != null && ba.isEnabled() && ba.getBondedDevices() != null) {
                          for (BluetoothDevice d : ba.getBondedDevices()) {
                              devs.add(d);
                              list.add("Paired: " + (d.getName() != null ? d.getName() : d.getAddress()));
                          }
                      }
                  } catch (Throwable ignored) {}
                  list.add("Open TV Bluetooth Settings / Pair New");
                  list.add((ba != null && ba.isEnabled()) ? "Turn Bluetooth OFF" : "Turn Bluetooth ON");
                  new AlertDialog.Builder(a, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("Bluetooth")
                      .setItems(list.toArray(new String[0]), new DialogInterface.OnClickListener() {
                          public void onClick(DialogInterface d, int w) {
                              if (w < devs.size() || w == devs.size()) {
                                  try {
                                      a.startActivity(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                                  } catch (Throwable e) {
                                      a.startActivity(new Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                                  }
                              } else if (ba != null) {
                                  try { if (ba.isEnabled()) ba.disable(); else ba.enable(); } catch (Throwable ignored) {}
                              }
                          }
                      }).show();
              }
          }
          EOF
          python3 -c '
          p = "launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java"
          s = open(p).read()
          if "BtFix.bind(this);" not in s:
              s = s.replace("super.onResume();", "super.onResume();\n        BtFix.bind(this);", 1)
              open(p, "w").write(s)
          '

      - name: Compile & Sign Uncompressed APK
        working-directory: ./launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -n 1)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -f -p 4 "$RAW_APK" aligned.apk
          keytool -genkey -v -keystore release.keystore -storepass android -alias releasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CleanYourTV,O=Android,C=IN"
          mkdir -p ../out_apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out ../out_apk/cleanyourtv-bt.apk aligned.apk
          ls -lh ../out_apk/cleanyourtv-bt.apk

      - name: Upload Working Merged APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Working-Merged-APK
          path: out_apk/cleanyourtv-bt.apk
