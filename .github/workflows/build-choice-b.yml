              s = re.sub(r'(super\.onCreate\s*\([^)]*\)\s*;)', r'\1\n        UiUpgrade.apply(this);', s, count=1)
              open(p, "w").write(s)

          mf = "launcher/app/src/main/AndroidManifest.xml"
          m = open(mf).read()
          m = re.sub(r'android:maxSdkVersion="\d+"', '', m)
          if 'requestLegacyExternalStorage' not in m:
              m = m.replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
          perms = [
              "QUERY_ALL_PACKAGES", "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE",
              "ACCESS_WIFI_STATE", "ACCESS_NETWORK_STATE",
              "BLUETOOTH", "BLUETOOTH_ADMIN", "BLUETOOTH_CONNECT", "BLUETOOTH_SCAN",
              "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"
          ]
          ins = "".join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms if f"android.permission.{x}" not in m)
          if ins:
              m = m.replace("<application", ins + "    <application", 1)
          open(mf, "w").write(m)
          PYEOF

      - name: Compile & Sign Uncompressed APK
        working-directory: ./launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -n 1)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -f -p 4 "$RAW_APK" aligned.apk
          keytool -genkey -v -keystore release.keystore -storepass android -alias releasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TV,O=Android,C=IN"
          mkdir -p ../out_apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out ../out_apk/cleanyourtv-bt.apk aligned.apk

      - name: Upload Fixed All-In-One APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Fixed-AllInOne-APK
          path: out_apk/cleanyourtv-bt.apk