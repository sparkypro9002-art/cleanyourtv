name: Compile Choice B Bluetooth Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gathin23/cleanyourtv
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          fetch-depth: 0

      - name: Fetch PR #311 (Xiaomi Bluetooth Pill Fork)
        run: |
          git fetch origin pull/311/head:pr-311-bt
          git checkout pr-311-bt

      - name: Turn On Opt-In Bluetooth Pill by Default in config.xml
        working-directory: ./launcher
        run: |
          python3 - << 'EOF'
          import glob, re
          for cfg in glob.glob("app/src/main/res/values*/config.xml"):
              txt = open(cfg).read()
              updated = re.sub(
                  r'(<bool\s+name="[^"]*bluetooth[^"]*"\s*>\s*)false(\s*</bool>)',
                  r'\g<1>true\g<2>',
                  txt,
                  flags=re.IGNORECASE
              )
              open(cfg, "w").write(updated)
              print(f"Enabled Bluetooth pill in {cfg}")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Sign APK
        working-directory: ./launcher
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease
          else
            gradle assembleDebug assembleRelease
          fi

      - name: Collect Signed APK
        run: |
          mkdir -p out_apk
          cp $(find launcher -name "*-debug.apk" | head -n 1) out_apk/cleanyourtv-bt.apk
          ls -lh out_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-ChoiceB-APK
          path: out_apk/cleanyourtv-bt.apk
          
