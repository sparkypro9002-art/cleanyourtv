name: Compile Choice B Bluetooth Launcher (v3.2 + PR 311)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Gathin23/cleanyourtv (v3.2)
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: main
          fetch-depth: 0

      - name: Merge PR #311 Bluetooth Pill Cleanly Onto v3.2
        run: |
          git config user.name "Builder"
          git config user.email "builder@users.noreply.github.com"
          git fetch origin pull/311/head:pr-311

          BASE_COMMIT=$(git merge-base main pr-311)
          git format-patch $BASE_COMMIT..pr-311 --stdout > pr311.patch
          git apply --3way --ignore-space-change --ignore-whitespace pr311.patch || true

          # 1. HomeKeyService.java has no Bluetooth code; keep pure v3.2 version so line 327 never breaks
          git checkout main -- launcher/app/src/main/java/com/gathin/tvhome/HomeKeyService.java

          # 2. Resolve any conflict markers in XML/Java cleanly
          python3 - << 'PYEOF'
          import glob, re

          for path in glob.glob("launcher/**/*", recursive=True):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
              except Exception:
                  continue

              if "<<<<<<<" not in content:
                  continue

              def resolve_block(match):
                  ours = match.group(1)
                  theirs = match.group(2)
                  # If theirs (PR #311) contains bluetooth logic, keep theirs or combine safely
                  if "bluetooth" in theirs.lower() or "bt" in theirs.lower():
                      # Check brace balance of ours and theirs
                      ours_diff = ours.count("{") - ours.count("}")
                      theirs_diff = theirs.count("{") - theirs.count("}")
                      if ours_diff == 0 and theirs_diff == 0:
                          return ours + theirs
                      return theirs
                  else:
                      # Otherwise keep v3.2 (ours) so v3.2 methods stay balanced
                      return ours

              resolved = re.sub(
                  r"<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n",
                  resolve_block,
                  content,
                  flags=re.DOTALL
              )

              # Safety check for MainActivity.java:957 before applyViewInputsHandler
              if path.endswith("MainActivity.java"):
                  # Ensure braces are balanced before private/public method declarations
                  lines = resolved.splitlines()
                  out_lines = []
                  depth = 0
                  in_class = False
                  for line in lines:
                      stripped = line.strip()
                      if re.match(r"^(private|public|protected)\s+(void|boolean|int|String|View|Drawable)\s+\w+\s*\(", stripped):
                          # Class body level is depth == 1; close any unclosed method braces before starting a new method
                          while depth > 1:
                              out_lines.append("    }")
                              depth -= 1
                      out_lines.append(line)
                      # Track brace depth (ignoring strings/comments roughly)
                      code_only = re.sub(r'".*?"|//.*$', "", line)
                      depth += code_only.count("{") - code_only.count("}")
                  resolved = "\n".join(out_lines) + "\n"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(resolved)
              print(f"Cleanly resolved {path}")
          PYEOF

      - name: Force-Enable Bluetooth Pill & v3.2 Visual Flags by Default
        working-directory: ./launcher
        run: |
          python3 - << 'EOF'
          import glob, os, re

          for xml_file in glob.glob("app/src/main/res/values*/*.xml"):
              txt = open(xml_file).read()
              txt = re.sub(
                  r'(<bool\s+name="[^"]*(?:bluetooth|date_below_clock|header_white|wifi_status)[^"]*"\s*>\s*)false(\s*</bool>)',
                  r'\g<1>true\g<2>',
                  txt,
                  flags=re.IGNORECASE
              )
              open(xml_file, "w").write(txt)

          for java_file in glob.glob("app/src/main/java/**/*.java", recursive=True):
              jtxt = open(java_file).read()
              for key in ["show_bluetooth", "bluetooth_pill", "show_bluetooth_pill", "date_below_clock", "header_white", "wifi_status_color", "wifi_status_warnings"]:
                  jtxt = re.sub(
                      rf'(optBoolean\(\s*"{key}"\s*,\s*)false(\s*\))',
                      r'\g<1>true\g<2>',
                      jtxt
                  )
              open(java_file, "w").write(jtxt)

          gradle_file = "app/build.gradle"
          if os.path.exists(gradle_file):
              g = open(gradle_file).read()
              g = re.sub(r'minifyEnabled\s+false', 'minifyEnabled true\n            shrinkResources true', g)
              open(gradle_file, "w").write(g)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile & Sign APK
        working-directory: ./launcher
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease || ./gradlew assembleDebug

          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -n 1)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          $BUILD_TOOLS/zipalign -f -p 4 "$RAW_APK" aligned.apk
          keytool -genkey -v -keystore release.keystore -storepass android -alias releasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CleanYourTV,O=Android,C=IN"
          mkdir -p ../out_apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out ../out_apk/cleanyourtv-bt.apk aligned.apk
          ls -lh ../out_apk/cleanyourtv-bt.apk

      - name: Upload Merged v3.2 + Bluetooth APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-ChoiceB-APK
          path: out_apk/cleanyourtv-bt.apk
          
