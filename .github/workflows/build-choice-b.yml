name: Compile Choice B Bluetooth Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gathin23/cleanyourtv
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          fetch-depth: 0

      - name: Fetch PR #311 (Xiaomi Bluetooth Pill Fork)
        run: |
          git fetch origin pull/311/head:pr-311-bt
          git checkout pr-311-bt

      - name: Turn On Opt-In Bluetooth Pill by Default in config.xml
        working-directory: ./launcher
        run: |
          python3 - << 'EOF'
          import glob, re
          for cfg in glob.glob("app/src/main/res/values*/config.xml"):
              txt = open(cfg).read()
              updated = re.sub(
                  r'(<bool\s+name="[^"]*bluetooth[^"]*"\s*>\s*)false(\s*</bool>)',
                  r'\g<1>true\g<2>',
                  txt,
                  flags=re.IGNORECASE
              )
              open(cfg, "w").write(updated)
              print(f"Enabled Bluetooth pill in {cfg}")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and Sign APK
        working-directory: ./launcher
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "app/build.gradle" ] || [ -f "build.gradle" ]; then
            gradle assembleDebug
          else
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
            PLATFORM=$(ls -d $ANDROID_HOME/platforms/* | tail -n 1)
            mkdir -p build/gen build/obj build/apk
            $BUILD_TOOLS/aapt package -f -m -J build/gen -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $PLATFORM/android.jar
            find app/src/main/java build/gen -name "*.java" > build/sources.txt
            javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM/android.jar -d build/obj @build/sources.txt
            $BUILD_TOOLS/d8 --lib $PLATFORM/android.jar --output build/apk $(find build/obj -name "*.class")
            $BUILD_TOOLS/aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $PLATFORM/android.jar -F build/apk/unsigned.apk
            cd build/apk && $BUILD_TOOLS/aapt add unsigned.apk classes.dex && cd ../..
            $BUILD_TOOLS/zipalign -f 4 build/apk/unsigned.apk build/apk/aligned.apk
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out build/apk/cleanyourtv-bt.apk build/apk/aligned.apk
          fi

      - name: Collect Signed APK
        run: |
          mkdir -p out_apk
          find launcher -name "*.apk" ! -name "*unsigned*" ! -name "*aligned*" -exec cp {} out_apk/cleanyourtv-bt.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-ChoiceB-APK
          path: out_apk/cleanyourtv-bt.apk
          
